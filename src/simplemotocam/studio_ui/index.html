<!doctype html>
<html lang="sl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SimpleOpenCV · Algorithm Studio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="./" aria-label="SimpleOpenCV"
        ><span class="mark">◉</span> SimpleOpenCV <small>STUDIO</small></a
      ><input id="name" data-i18n-aria="projectName" maxlength="100" /><span
        class="spacer"
      ></span>
      <label class="app-language engine-choice"><span data-i18n="opencvEngine"></span><select id="opencvBackend" data-i18n-aria="opencvEngine"></select></label>
      <label class="app-language"
        ><span data-i18n="language"></span
        ><select id="locale" data-i18n-aria="language"></select
      ></label>
      <button id="guide" data-i18n="guide"></button
      ><button id="open" data-i18n="open"></button
      ><button id="save" data-i18n="save"></button
      ><button id="export" data-i18n="export"></button
      ><button class="primary" id="run"></button>
    </header>
    <div class="toolbar">
      <span id="backendBadge" class="tag"></span
      ><span data-i18n="builder"></span><span class="spacer"></span
      ><button id="undo" data-i18n-title="undo">↶</button
      ><button id="redo" data-i18n-title="redo">↷</button
      ><button id="step" data-i18n="step"></button><span id="dirty"></span
      ><span
        id="interfaceDraft"
        class="interface-draft"
        data-i18n="draft"
        hidden
      ></span>
    </div>
    <dialog id="catalogDetail"><button id="closeCatalog" class="catalog-close" aria-label="Close">×</button><div id="catalogBody"></div></dialog>
    <dialog id="additionalAlgorithms" aria-labelledby="additionalTitle">
      <div class="additional-head"><h2 id="additionalTitle" data-i18n="additionalAlgorithms"></h2><button id="closeAdditional" type="button" data-i18n-aria="close">×</button></div>
      <input id="additionalSearch" data-i18n-placeholder="search" data-i18n-aria="search" />
      <select id="additionalSelect" data-i18n-aria="chooseEntry"></select>
      <div id="additionalList"></div>
    </dialog>
    <main>
      <aside class="library">
        <h2 data-i18n="library"></h2>
        <p data-i18n="libraryHint"></p>
        <button id="addEmpty" type="button" class="primary" data-i18n="customBlock"></button>
        <input
          id="search"
          data-i18n-placeholder="search"
          data-i18n-aria="search"
        />
        <label class="field"><span data-i18n="catalogChoice"></span><select id="libraryCategory" data-i18n-aria="catalogChoice"></select></label>
        <select id="librarySelect" data-i18n-aria="chooseEntry"></select>
        <button id="openAdditional" type="button" aria-haspopup="dialog" data-i18n="additionalAlgorithms"></button>
        <div id="library"></div>
        <div class="future">
          <b data-i18n="geometry"></b>
          <p data-i18n="geometryHint"></p>
          <small data-i18n="planned"></small>
        </div>
        <button
          class="text-button"
          id="libraryGuide"
          data-i18n="guide"
        ></button>
      </aside>
      <section class="workspace">
        <div class="canvas-heading">
          <div>
            <h1 data-i18n="headline"></h1>
            <p data-i18n="flow"></p>
          </div>
          <span class="badge" data-i18n="signedMath"></span>
        </div>
        <div id="graph" data-i18n-aria="blocks"></div>
        <div class="preview-heading">
          <h2 data-i18n="preview"></h2>
          <label
            ><span data-i18n="gain"></span> ×
            <input
              id="gain"
              type="number"
              min="0.1"
              max="100"
              step="0.1" /></label
          ><label
            ><input id="signed" type="checkbox" />
            <span data-i18n="signed"></span
          ></label>
        </div>
        <div class="previews">
          <figure>
            <figcaption>
              <span data-i18n="source"></span><span id="dimensions"></span>
            </figcaption>
            <img id="camera" data-i18n-alt="sourcePreview" /><small
              data-i18n="sourceHint"
            ></small>
          </figure>
          <figure>
            <figcaption>
              <span data-i18n="signal"></span
              ><select id="signal" data-i18n-aria="signalPreview"></select>
            </figcaption>
            <img id="signalImage" data-i18n-alt="signalPreview" /><small
              id="signalStats"
            ></small>
          </figure>
          <figure>
            <figcaption>
              <span data-i18n="result"></span
              ><select id="result" data-i18n-aria="resultPreview"></select>
            </figcaption>
            <img id="resultImage" data-i18n-alt="resultPreview" /><small
              id="resultStats"
            ></small>
          </figure>
        </div>
        <p class="hint" data-i18n="previewHint"></p>
      </section>
      <aside class="inspector">
        <div class="eyebrow" data-i18n="inspect"></div>
        <h2 id="selectedTitle"></h2>
        <div id="parameters"></div>
        <hr />
        <div class="lesson-head"><h2 data-i18n="why"></h2></div>
        <div id="lesson"></div>
        <label class="code-label"
          ><span data-i18n="example"></span
          ><select id="codeLanguage" data-i18n-aria="programLanguage">
            <option value="python">Python</option>
            <option value="cpp">C++</option>
            <option value="c">C</option>
            <option value="java">Java</option>
          </select></label
        >
        <pre id="example"></pre>
        <p class="hint" data-i18n="exampleHint"></p>
      </aside>
    </main>
    <footer>
      <span class="dot"></span
      ><span id="status" role="status" data-i18n="starting"></span
      ><span class="spacer"></span
      ><button id="openAbout" data-i18n="about" type="button"></button>
      <span>OpenCV · <span data-i18n="local"></span></span>
    </footer>
    <dialog id="projects" aria-labelledby="projectsTitle">
      <div class="dialog-head">
        <h2 id="projectsTitle" data-i18n="projects"></h2>
        <button id="closeProjects" data-i18n-aria="close">×</button>
      </div>
      <label class="file-button"
        ><span data-i18n="import"></span
        ><input id="import" type="file" accept=".json"
      /></label>
      <div id="projectList"></div>
    </dialog>
    <dialog id="codeEditor" aria-labelledby="codeEditorTitle">
      <div class="dialog-head">
        <h2 id="codeEditorTitle" data-i18n="editCode"></h2>
        <button id="closeCodeEditor" type="button" data-i18n-aria="close">×</button>
      </div>
      <div id="codeEditorBody"></div>
      <p id="codeEditorStatus" role="status" aria-live="polite"></p>
    </dialog>
    <dialog id="classroom" aria-labelledby="classroomTitle">
      <div class="classroom-head">
        <h2 id="classroomTitle" data-i18n="guide"></h2>
        <button
          id="closeClassroom"
          data-i18n-aria="close"
          data-i18n-title="close"
        >
          ×
        </button>
      </div>
      <iframe id="classroomFrame" data-i18n-title="guide"></iframe>
    </dialog>
    <dialog id="about" aria-labelledby="aboutTitle">
      <div class="classroom-head">
        <h2 id="aboutTitle" data-i18n="about"></h2>
        <button id="closeAbout" data-i18n-aria="close" data-i18n-title="close">×</button>
      </div>
      <iframe id="aboutFrame" data-i18n-title="about"></iframe>
    </dialog>
    <input
      id="media"
      type="file"
      accept=".png,.jpg,.jpeg,.bmp,.webp,.avi,.mp4,.mov,.mkv"
      hidden
    />
    <script src="manuals/learning/lessons.js"></script>
    <script src="manuals/learning/translations.js"></script>
    <script src="i18n.js"></script>
    <script src="manuals/learning/sequences-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
