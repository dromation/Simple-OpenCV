[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplemotocam"
version = "0.5.0"
description = "Visual OpenCV algorithm studio with channel algebra and standalone export"
license = {file = "LICENSE"}
readme = "SIMPLEMOTOCAM.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.8,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
simplemotocam = "simplemotocam.cli:main"
simplemotocam-studio = "simplemotocam.studio:main"

[tool.setuptools.package-data]
simplemotocam = ["studio_ui/*", "studio_sequences.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests_core"]
addopts = "-ra"
