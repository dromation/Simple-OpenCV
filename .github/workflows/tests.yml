name: Numerical and export tests
on: [push, pull_request]
jobs:
  static-html:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r deploy/cpanel/requirements.txt
      - run: python tools/package_static.py
      - run: python tools/browser-tests/static_reference.py
      - run: npm ci --prefix tools/browser-tests
      - run: npm exec --prefix tools/browser-tests -- playwright install --with-deps chromium
      - run: |
          python -m http.server 8780 --bind 127.0.0.1 --directory dist > /tmp/static-studio.log 2>&1 &
          node tools/browser-tests/verify_static.cjs
          node tools/browser-tests/verify_static_numeric.cjs

  cpanel-linux:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r deploy/cpanel/requirements.txt pytest cmake==3.31.10
      - run: python tools/fetch_references.py opencv-2.4.13.7
      - run: python tools/build_opencv24_linux.py --jobs 2
      - run: python -m pytest tests_core/test_studio_web.py tests_core/test_studio_backend.py tests_core/test_detection_sequences.py -q
      - run: python tools/package_cpanel.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - run: python -m pytest tests_core tools/doc_translate/test_translate.py

  opencv24:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install --target work/build-tools cmake==3.31.10
      - run: python tools/fetch_references.py opencv-2.4.13.7
      - run: python tools/build_opencv24.py
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - run: python -m pytest tests_core/test_studio_backend.py tests_core/test_detection_sequences.py tests_core/test_compiled_blocks.py tests_core/test_block_languages.py -q
