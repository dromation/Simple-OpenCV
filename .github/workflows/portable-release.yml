name: Native portable release checks
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        default: v0.6.0
        required: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify downloaded executable on its native platform
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python tools/check_portable_release.py --tag "${{ env.RELEASE_TAG }}"
